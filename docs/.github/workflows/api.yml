name: api

on:
  workflow_dispatch:
  repository_dispatch:
    types: [arlecchino-released]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      - name: Check the framework out beside this repository
        uses: actions/checkout@v7
        with:
          repository: The1fEst/Arlecchino
          ref: ${{ github.event.client_payload.ref }}
          path: arlecchino

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the framework
        run: dotnet build arlecchino/Arlecchino.slnx --configuration Release

      - name: Generate the API reference
        run: dotnet run apidocs/ApiDocs.cs -- --repo arlecchino --out docs/api

      - name: Commit whatever changed
        id: commit
        env:
          RELEASE: ${{ github.event.client_payload.ref }}
        run: |
          rm -rf arlecchino

          if [ -z "$(git status --porcelain docs/api)" ]; then
            echo "The API reference is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "Regenerate the API reference${RELEASE:+ for $RELEASE}"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A commit made with GITHUB_TOKEN does not start another workflow, so the deploy has to be asked
  # for rather than waited on — and it has to build the branch, since the commit above is newer than
  # the event that started this run.
  publish:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
