name: Feature request
description: Something the framework should be able to do
labels: [feature]

body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to build
      description: >
        The screen or interaction you have in mind, rather than the API you imagine for it — the
        shape usually follows from the case.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: What the framework makes you write instead, and where that falls down.

  - type: checkboxes
    id: settled
    attributes:
      label: Settled questions
      description: >
        Two answers are already fixed, and a request built on either will be closed — see
        [CONTRIBUTING.md](https://github.com/The1fEst/Arlecchino/blob/master/CONTRIBUTING.md).
      options:
        - label: This is not a component tree or a layout container hierarchy
          required: true
        - label: This does not hardcode user-visible text in the framework
          required: true
