name: docs

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  push:
    branches: [master]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: >
          A tag to build, such as v2026.10.2. Left empty, the latest v* tag is built, not master, so
          unreleased API never reaches the site.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: The tag to build, so the reference is generated from the code that was released.
        type: string
        required: true
      deploy:
        description: Publish the site. A build for a pull request or a push never publishes.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check out the latest release
        if: github.event_name == 'workflow_dispatch' && inputs.ref == ''
        run: |
          git fetch --tags --force origin
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$tag" ]; then
            echo "::error::There is no v* tag to build."
            exit 1
          fi

          git checkout --detach "$tag"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the framework
        run: dotnet build Arlecchino.slnx --configuration Release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Generate the API reference
        working-directory: docs
        run: npm run api

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || inputs.deploy

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deploy
        uses: actions/deploy-pages@v5
