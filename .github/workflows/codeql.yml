name: codeql

on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'assets/**']
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
