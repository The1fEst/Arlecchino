name: benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Which benchmarks to run, as a BenchmarkDotNet filter
        default: '*'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          dotnet run --project benchmarks/Arlecchino.Benchmarks/Arlecchino.Benchmarks.csproj \
            --configuration Release -- --filter "$FILTER" --exporters GitHub JSON

      - name: Report
        run: cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BenchmarkDotNet.Artifacts/results/*
