name: build

on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

env:
  COVERAGE_LINES: 85
  COVERAGE_BRANCHES: 66

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Arlecchino.slnx

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --framework net10.0 --no-build --collect:"XPlat Code Coverage" --results-directory coverage

          $report = Get-ChildItem coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) {
            Write-Host "::error::The test run produced no coverage report"
            exit 1
          }

          $invariant = [Globalization.CultureInfo]::InvariantCulture
          function Percent($rate) { [math]::Round([double]::Parse($rate, $invariant) * 100, 1) }

          $coverage = ([xml](Get-Content $report.FullName -Raw)).coverage
          $lines = Percent $coverage.'line-rate'
          $branches = Percent $coverage.'branch-rate'

          $summary = @("## Coverage", "", "| Assembly | Lines | Branches |", "|---|---:|---:|")
          foreach ($package in $coverage.packages.package) {
            $summary += "| $($package.name) | $(Percent $package.'line-rate')% | $(Percent $package.'branch-rate')% |"
          }
          $summary += "| **Total** | **$lines%** | **$branches%** |"
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($lines -lt $env:COVERAGE_LINES) {
            Write-Host "::error::Line coverage fell to $lines%, below the $($env:COVERAGE_LINES)% the suite is held to"
            exit 1
          }
          if ($branches -lt $env:COVERAGE_BRANCHES) {
            Write-Host "::error::Branch coverage fell to $branches%, below the $($env:COVERAGE_BRANCHES)% the suite is held to"
            exit 1
          }
        shell: pwsh

      - name: Against a real terminal
        if: matrix.os == 'ubuntu-latest'
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          tmux -V

          failed=""

          for check in oracle keys terminal live; do
            echo "::group::$check"
            dotnet run --project tools/Arlecchino.Tools --configuration Release --no-build -- "$check" \
              || failed="$failed $check"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::The terminal disagreed with:$failed"
            exit 1
          fi
        shell: bash

      - name: Benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project benchmarks/Arlecchino.Benchmarks/Arlecchino.Benchmarks.csproj --configuration Release --no-build -- --filter "*" --job dry

      - name: Native
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish samples/Arlecchino.Sample/Arlecchino.Sample.csproj --configuration Release \
            -p:AotProbe=true -o native

          frame=$(./native/Arlecchino.Sample --frame default 100x20)
          echo "$frame"

          case "$frame" in
            *"A R L E C C H I N O"*) ;;
            *) echo "::error::The native build drew no frame"; exit 1 ;;
          esac
        shell: bash

      - name: Inspect
        if: matrix.os == 'windows-latest'
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools
          jb inspectcode Arlecchino.slnx --output=inspect.json --severity=WARNING
          $issues = (Get-Content inspect.json -Raw | ConvertFrom-Json).runs[0].results
          if ($issues.Count -gt 0) {
            $issues | ForEach-Object {
              $place = $_.locations[0].physicalLocation
              Write-Host "::error file=$($place.artifactLocation.uri),line=$($place.region.startLine)::$($_.ruleId): $($_.message.text)"
            }
            exit 1
          }
        shell: pwsh

      - name: Pack
        run: |
          dotnet pack src/Arlecchino.Core/Arlecchino.Core.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino/Arlecchino.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino.Testing/Arlecchino.Testing.csproj --configuration Release --no-build

      - name: Build an application against the packages
        run: |
          version=$(grep -oE '<Version>[^<]+' Directory.Build.props | head -1 | cut -d'>' -f2)

          consume() {
            sdk="$1"
            work="${RUNNER_TEMP}/consumer-$sdk"

            rm -rf "$work"
            mkdir -p "$work"
            cd "$work"

            printf '{ "sdk": { "version": "%s", "rollForward": "latestFeature" } }\n' "$sdk" > global.json
            dotnet new console -n Consumer -o .
            cp "$GITHUB_WORKSPACE/.github/consumer/Program.cs" .
            dotnet new nugetconfig
            dotnet nuget add source "$GITHUB_WORKSPACE/artifacts/packages" --name arlecchino-local --configfile nuget.config
            dotnet add package Arlecchino --version "$version"
            dotnet build
          }

          consume 10.0.100
          consume 8.0.100
        shell: bash

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*
