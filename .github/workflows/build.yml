name: build

on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Arlecchino.slnx

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Inspect
        if: matrix.os == 'windows-latest'
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools
          jb inspectcode Arlecchino.slnx --output=inspect.json --severity=WARNING
          $issues = (Get-Content inspect.json -Raw | ConvertFrom-Json).runs[0].results
          if ($issues.Count -gt 0) {
            $issues | ForEach-Object {
              $place = $_.locations[0].physicalLocation
              Write-Host "::error file=$($place.artifactLocation.uri),line=$($place.region.startLine)::$($_.ruleId): $($_.message.text)"
            }
            exit 1
          }
        shell: pwsh

      - name: Pack
        run: |
          dotnet pack src/Arlecchino.Core/Arlecchino.Core.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino/Arlecchino.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino.Testing/Arlecchino.Testing.csproj --configuration Release --no-build

      - name: Build an application against the packages
        run: |
          version=$(grep -oE '<Version>[^<]+' Directory.Build.props | head -1 | cut -d'>' -f2)
          work="${RUNNER_TEMP}/consumer"

          rm -rf "$work"
          dotnet new console -o "$work" -n Consumer
          cp .github/consumer/Program.cs "$work/"

          cd "$work"
          dotnet new nugetconfig
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts/packages" --name arlecchino-local --configfile nuget.config
          dotnet add package Arlecchino --version "$version"
          dotnet build
        shell: bash

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
