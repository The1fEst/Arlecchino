name: build

on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Arlecchino.slnx

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Pack
        run: |
          dotnet pack src/Arlecchino.Core/Arlecchino.Core.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino/Arlecchino.csproj --configuration Release --no-build
          dotnet pack src/Arlecchino.Testing/Arlecchino.Testing.csproj --configuration Release --no-build

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
