name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          version=${{ steps.version.outputs.value }}
          dotnet pack src/Arlecchino.Core/Arlecchino.Core.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino/Arlecchino.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino.Testing/Arlecchino.Testing.csproj --configuration Release --no-build -p:Version=$version

      - name: Exchange the workflow identity for a NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          user: fEst

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "The changelog has no section for $VERSION" >&2
            exit 1
          fi

          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md $prerelease \
            artifacts/packages/*.nupkg

      # The packages are already on NuGet by now, so nothing here is worth failing the release over:
      # the site regenerates on a schedule anyway, and a red run would say the release went wrong.
      - name: Ask the documentation site to regenerate its API reference
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN is not set; the site picks this release up on its next scheduled run."
            exit 0
          fi

          if ! gh api repos/The1fEst/Arlecchino.Docs/dispatches --method POST --input - <<EOF
          {"event_type":"arlecchino-released","client_payload":{"ref":"$GITHUB_REF_NAME"}}
          EOF
          then
            echo "::warning::The documentation site could not be reached; it picks this release up on its next scheduled run."
          fi
