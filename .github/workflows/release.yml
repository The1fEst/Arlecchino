name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from the tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::A release is a tag. Run this against a v* tag, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

          version=${GITHUB_REF_NAME#v}

          if ! printf '%s' "$version" | grep -qE '^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::A version is year.month.build, as in v2026.8.1. $GITHUB_REF_NAME is not one." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Arlecchino.slnx --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test tests/Arlecchino.Tests/Arlecchino.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          version=${{ steps.version.outputs.value }}
          dotnet pack src/Arlecchino.Core/Arlecchino.Core.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino/Arlecchino.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino.Atoms.History/Arlecchino.Atoms.History.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino.Pictures/Arlecchino.Pictures.csproj --configuration Release --no-build -p:Version=$version
          dotnet pack src/Arlecchino.Testing/Arlecchino.Testing.csproj --configuration Release --no-build -p:Version=$version

      - name: Exchange the workflow identity for a NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          user: fEst

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "The changelog has no section for $VERSION" >&2
            exit 1
          fi

          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md $prerelease \
            artifacts/packages/*.nupkg

  docs:
    needs: publish

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.ref_name }}
